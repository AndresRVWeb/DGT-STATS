name: DGT Extractor Monthly Cron

on:
  schedule:
    # Ejecutar los días 15, 18 y 22 de cada mes a las 04:00 UTC
    - cron: '0 4 15,18,22 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si se desea

jobs:
  sync-dgt:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DGT Sync API Endpoint
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.API_SECRET_TOKEN }}" ]; then
            echo "Aviso: Configura los secretos APP_URL y API_SECRET_TOKEN en los Settings de GitHub del repositorio para activar la llamada automática."
            exit 0
          fi
          
          echo "Disparando sincronización mensual oficial DGT en ${{ secrets.APP_URL }}/api/dgt/sync..."
          
          HTTP_STATUS=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/dgt/sync" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.API_SECRET_TOKEN }}" \
            -d '{"scope": "missing_2026"}')
            
          echo "Respuesta HTTP: $HTTP_STATUS"
          cat /tmp/sync_response.json
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error en la sincronización remota."
            exit 1
          fi
